# Server Port
server.port=${PORT:8082}

# JWT Secret Key (Must be at least 32 characters for HMAC-SHA-256)
jwt.secret=${JWT_SECRET:busBookingSystemSuperSecretKeyWithAtLeast32BytesLength123!}

# Database Configuration:
# Defaults to in-memory H2 database for out-of-the-box local running.
# When PostgreSQL env variables are set (DB_URL, DB_USERNAME, DB_PASSWORD), PostgreSQL is used automatically.
spring.datasource.url=${DB_URL:jdbc:h2:mem:busbooking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
